# Источники (загружаются Airflow DAG, dbt их только читает)
sources:
  - name: dwh
    schema: dwh
    tables:
      - name: fact_production_daily
        description: "Суточная добыча по скважинам (загружается Airflow)"
      - name: fact_injection_daily
        description: "Суточная закачка по нагнетательным скважинам"
      - name: dim_well
        description: "Измерение «Скважина» с иерархией (месторождение → куст → пласт)"

# Модели
models:
  # ============ Staging ============
  - name: stg_production_daily
    description: "Суточная добыча: стандартизированные имена и типы"
    columns:
      - name: well_id
        tests:
          - not_null
      - name: date
        tests:
          - not_null
      - name: oil_t
        tests:
          - not_null
      - name: is_producing
        tests:
          - not_null

  - name: stg_injection_daily
    description: "Суточная закачка: стандартизированные имена и типы"
    columns:
      - name: well_id
        tests:
          - not_null
      - name: date
        tests:
          - not_null
      - name: injection_m3
        tests:
          - not_null

  - name: stg_dim_well
    description: "Измерение «Скважина»: без трансформаций, для JOIN"
    columns:
      - name: well_id
        tests:
          - not_null
          - unique
      - name: field_name
        tests:
          - not_null
      - name: purpose
        tests:
          - not_null
          - accepted_values:
              values: ['producer', 'injector']
      - name: trajectory
        tests:
          - not_null
          - accepted_values:
              values: ['directional', 'horizontal', 'multilateral']

  # ============ Marts ============
  - name: mart_field_monthly
    description: |
      Витрина: добыча и закачка по месторождению × месяц.
      Содержит обводнённость и коэффициент компенсации.
    columns:
      - name: month
        tests:
          - not_null
      - name: field_name
        tests:
          - not_null
      - name: oil_t
        tests:
          - not_null
      - name: watercut
        tests:
          - not_null
      - name: compensation
        tests:
          - not_null

  - name: mart_well_performance
    description: |
      Витрина: месячная эффективность скважин.
      Decline rate, watercut, суточный дебит по каждой скважине.
    columns:
      - name: well_id
        tests:
          - not_null
      - name: month
        tests:
          - not_null
      - name: oil_t
        tests:
          - not_null
      - name: watercut
        tests:
          - not_null
      - name: purpose
        tests:
          - not_null
          - accepted_values:
              values: ['producer', 'injector']
