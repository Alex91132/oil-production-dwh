# Источники (загружаются Airflow DAG, dbt их только читает)
sources:
  - name: dwh
    schema: dwh
    tables:
      - name: fact_production_daily
        description: "Суточная добыча по скважинам (загружается Airflow)"
      - name: fact_injection_daily
        description: "Суточная закачка по нагнетательным скважинам"
      - name: dim_well
        description: "Измерение «Скважина» с иерархией (месторождение → куст → пласт)"
      - name: dim_well_scd
        description: "SCD Type 2: версии атрибутов скважины (valid_from / valid_to / is_current)"

# Модели
models:
  # ============ Staging ============
  - name: stg_production_daily
    description: "Суточная добыча: стандартизированные имена и типы"
    columns:
      - name: well_id
        data_tests:
          - not_null
      - name: date
        data_tests:
          - not_null
      - name: oil_t
        data_tests:
          - not_null
      - name: is_producing
        data_tests:
          - not_null

  - name: stg_injection_daily
    description: "Суточная закачка: стандартизированные имена и типы"
    columns:
      - name: well_id
        data_tests:
          - not_null
      - name: date
        data_tests:
          - not_null
      - name: injection_m3
        data_tests:
          - not_null

  - name: stg_dim_well
    description: "Измерение «Скважина»: без трансформаций, для JOIN"
    columns:
      - name: well_id
        data_tests:
          - not_null
          - unique
      - name: field_name
        data_tests:
          - not_null
      - name: purpose
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['producer', 'injector']
      - name: trajectory
        data_tests:
          - accepted_values:
              arguments:
                values: ['directional', 'horizontal', 'multilateral']

  # ============ Marts ============
  - name: mart_field_monthly
    description: >
      Витрина «месторождение × месяц». Формулы совпадают с витриной Airflow:
      liquid_m3 = oil_t * 1000 / oil_density + water_m3, watercut = water / liquid,
      compensation = injection / liquid. Совпадение проверяется тестом
      assert_mart_matches_airflow в общем конвейере.
    columns:
      - name: month
        data_tests:
          - not_null
      - name: field_name
        data_tests:
          - not_null
      - name: oil_t
        data_tests:
          - not_null
      - name: liquid_m3
        data_tests:
          - not_null
      - name: watercut
        description: "Доля воды в добытой жидкости; всегда в [0, 1]"
        data_tests:
          - not_null
      - name: compensation
        description: "Закачка / отбор жидкости; 0, если закачки на месторождении нет"
        data_tests:
          - not_null

  - name: mart_well_performance
    description: >
      Витрина «скважина × месяц»: дебит, обводнённость, темп падения добычи.
      Колонки явно алиасятся — в ClickHouse ссылка `m.oil_t` без алиаса
      создаёт колонку с именем «m.oil_t».
    columns:
      - name: month
        data_tests:
          - not_null
      - name: well_id
        data_tests:
          - not_null
      - name: oil_t
        data_tests:
          - not_null
      - name: watercut
        description: "Доля воды; NULL, если жидкости не было (остановленная скважина)"
      - name: oil_rate_t_per_day
        description: "Среднесуточный дебит по отработанным часам"
      - name: purpose_on_date
        description: "Назначение на дату месяца из SCD; текущее, если истории за период нет"
        data_tests:
          - not_null
      - name: purpose_from_history
        description: "1 — назначение взято из истории версий, 0 — fallback на текущее"
